name: Lean formalization

on:
  push:
    branches: [main, moment-6-8-10]
    paths:
      - "formalization/**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - "lake-manifest.json"
      - ".github/workflows/lean-formalization.yml"
      - "tests/test_higher_moments.py"
  pull_request:
    branches: [main]
    paths:
      - "formalization/**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - "lake-manifest.json"
      - ".github/workflows/lean-formalization.yml"
      - "tests/test_higher_moments.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean (first attempt)
        id: lean_first
        uses: leanprover/lean-action@v1
        timeout-minutes: 10
        continue-on-error: true
      - name: Retry Lean setup after transient download failure
        id: lean_retry
        if: steps.lean_first.outcome == 'failure'
        uses: leanprover/lean-action@v1
        timeout-minutes: 10
      - name: Build formalization
        run: lake build EvgenyTheorem
