name = "EvgenyTheorem"
version = "0.1.0"
srcDir = "formalization"
description = "Lean 4 formalization of a closed-form trace identity on Sierpinski gasket graphs (SU(2) connection operator)"
keywords = ["math"]
defaultTargets = ["EvgenyTheorem"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "EvgenyTheorem"
